name: Bug report
description: Report a reproducible problem in Bluetify
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include App Passwords, API keys, or unredacted state files.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v2.0.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Node.js
        - Docker
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: Provide the smallest reliable reproduction.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed credentials and private data.
          required: true
        - label: I searched existing issues.
          required: true
